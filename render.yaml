# Render Blueprint — KO-Detect
#
# 사용법
#   Render 대시보드 → New → Blueprint → 이 저장소 선택 → Apply
#   render.yaml 을 읽어 웹 서비스와 데이터베이스를 한 번에 만듭니다.
#   API 키·CLI 토큰이 필요 없습니다.
#
# 배포 후 반드시 설정할 것
#   AUTH_PASSWORD  — 대시보드 Environment 탭에서 직접 입력 (sync:false 이므로 물어봅니다)
#
# 참고
#   free 플랜은 영구 디스크가 없어 업로드 원본이 재시작 시 사라집니다.
#   원본을 보존해야 하면 아래 disk 블록의 주석을 풀고 유료 플랜으로 올리십시오.

databases:
  - name: kodetect-db
    plan: free                 # free Postgres 는 생성 후 30일 뒤 만료됩니다
    databaseName: kodetect
    user: kodetect
    region: oregon

services:
  - type: web
    name: kodetect
    runtime: python
    plan: free
    region: oregon             # 기존 서비스와 같은 리전 (프라이빗 네트워크 공유)
    branch: main
    autoDeploy: true
    healthCheckPath: /healthz

    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend

    # 업로드 원본·오버레이를 보존하려면 유료 플랜으로 올리고 아래를 활성화한 뒤
    # STORAGE_DIR 을 /var/data/storage 로 바꾸십시오.
    # disk:
    #   name: kodetect-storage
    #   mountPath: /var/data
    #   sizeGB: 1

    envVars:
      # opencv·numpy 휠이 모두 제공되는 버전으로 고정합니다.
      - key: PYTHON_VERSION
        value: "3.12.8"

      # 도메인 코드가 backend/ 아래에 있고, datagen·rl 은 저장소 루트에 있습니다.
      - key: PYTHONPATH
        value: "backend:."

      - key: DATABASE_URL
        fromDatabase:
          name: kodetect-db
          property: connectionString

      # 세션 쿠키 서명 키. Render 가 생성해 고정합니다.
      # 비워 두면 프로세스마다 달라져 재시작할 때마다 로그인이 풀립니다.
      - key: SESSION_SECRET
        generateValue: true

      - key: AUTH_ENABLED
        value: "1"
      - key: AUTH_USER
        value: admin
      - key: AUTH_PASSWORD
        sync: false            # 대시보드에서 직접 입력 — 저장소에 남기지 않습니다

      # free 플랜에는 영구 디스크가 없어 /tmp 를 씁니다(재시작 시 초기화).
      - key: STORAGE_DIR
        value: /tmp/storage

      # 512MB 메모리에서는 워커를 1개로 둡니다.
      # 워커를 늘리려면 SESSION_SECRET 이 반드시 고정되어 있어야 합니다.
      - key: WEB_CONCURRENCY
        value: "1"

      # 계측 시뮬레이터가 스레드를 과점하지 않도록 제한
      - key: OMP_NUM_THREADS
        value: "1"
